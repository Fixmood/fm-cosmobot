<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FM Control Center</title>
<link rel="stylesheet" href="/static/styles.css?v=4">
</head>
<body>

<div class="shell" id="app" data-rail="full">

  <!-- ── 侧栏 ──────────────────────────────────────────────────────────── -->
  <aside class="rail">
    <div class="rail-top">
      <div class="rail-badge">FM</div>
      <div class="rail-name">
        <b>Control Center</b>
        <span>运营控制台</span>
      </div>
      <button class="rail-fold" id="rail-toggle" type="button" aria-label="折叠侧栏" title="折叠侧栏（\）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7z"/></svg>
      </button>
    </div>

    <nav class="nav" id="nav" aria-label="主导航">
      <p class="nav-cap">概览</p>
      <button class="nav-item" data-view="dashboard" data-name="仪表盘" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm10 7h6V11h-6zM4 20h6v-5H4zm10-11h6V4h-6z"/></svg>
        <span class="nav-txt">仪表盘</span>
      </button>

      <p class="nav-cap">对话</p>
      <button class="nav-item" data-view="messages" data-name="消息与归档" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H7l-3 3z"/></svg>
        <span class="nav-txt">消息与归档</span>
      </button>
      <button class="nav-item" data-view="sessions" data-name="会话管理" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm1 5h-2v6l5 3 1-1.7-4-2.3z"/></svg>
        <span class="nav-txt">会话管理</span>
      </button>

      <p class="nav-cap">业务</p>
      <button class="nav-item" data-view="library" data-name="跟打文库" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12a2 2 0 012 2v16l-7-3-7 3V5a2 2 0 012-2z"/></svg>
        <span class="nav-txt">跟打文库</span>
      </button>
      <button class="nav-item" data-view="scores" data-name="成绩中心" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h3v-7H4zm6 0h3V5h-3zm6 0h3v-10h-3z"/></svg>
        <span class="nav-txt">成绩中心</span>
      </button>
      <button class="nav-item" data-view="contests" data-name="赛文赛事" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v3a5 5 0 01-10 0zm-3 1h2v2a3 3 0 01-2-2zm14 0h2a3 3 0 01-2 2zM10 14h4v3h3v3H7v-3h3z"/></svg>
        <span class="nav-txt">赛文赛事</span>
      </button>
      <button class="nav-item" data-view="groups" data-name="群与房间" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>
        <span class="nav-txt">群与房间</span>
      </button>

      <p class="nav-cap">系统</p>
      <button class="nav-item" data-view="settings" data-name="设置" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 4l-2 1 .3 2.2-2 2-2.2-.3-1 2h-2.2l-1-2-2.2.3-2-2L6 13l-2-1 2-1-.3-2.2 2-2 2.2.3 1-2h2.2l1 2 2.2-.3 2 2L19 11z"/></svg>
        <span class="nav-txt">设置</span>
      </button>
    </nav>

    <div class="rail-foot">
      <span class="dot" id="lamp" data-s="idle"></span>
      <div class="rail-foot-txt">
        <b id="lamp-text">检测中…</b>
        <span>后台服务</span>
      </div>
    </div>
  </aside>

  <!-- ── 主区 ──────────────────────────────────────────────────────────── -->
  <main class="body">
    <header class="bar">
      <button class="icon-btn bar-burger" id="bar-burger" type="button" aria-label="打开导航">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      </button>

      <div class="bar-title">
        <span id="page-group">概览</span>
        <h1 id="page-title">仪表盘</h1>
      </div>

      <div class="bar-right">
        <label class="lookup">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 105.3 14l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
          <input id="find" type="search" placeholder="搜索文章、群、用户…" autocomplete="off" aria-label="全局搜索">
          <kbd>/</kbd>
        </label>
        <span class="time" id="clock"></span>
        <button class="icon-btn" id="theme" type="button" aria-label="切换主题" title="切换深浅色">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 109 9 7 7 0 01-9-9z"/></svg>
        </button>
        <button class="btn" id="reload" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <div class="page" id="page" aria-live="polite"></div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/static/app.js?v=4"></script>
</body>
</html>
