          <b id="sidebar-status-text">连接中…</b>
          <small>API <span id="sidebar-latency">—</span></small>
        </span>
        <span class="env-card-spark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </button>
      <div class="sidebar-links">
        <a class="sidebar-link" href="/classic" target="_blank" rel="noopener" title="旧版后台">
          <svg class="ico"><use href="#i-external"/></svg><span>旧版后台</span>
        </a>
        <a class="sidebar-link" href="/now" target="_blank" rel="noopener" title="状态页 /now">
          <svg class="ico"><use href="#i-activity"/></svg><span>状态页</span>
        </a>
        <button class="sidebar-link sidebar-logout" id="sidebar-logout" type="button" title="退出登录">
          <svg class="ico"><use href="#i-logout"/></svg><span>退出</span>
        </button>
      </div>
      <div class="sidebar-version">FM Console <b>v4</b><span class="sidebar-version-dot"></span><span id="build-stamp">native · 31 视图</span></div>
    </div>
  </aside>

  <!-- ── 主区域 ───────────────────────────────────────────────────────── -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="nav-open" type="button" aria-label="打开导航">
        <svg class="ico"><use href="#i-menu"/></svg>
      </button>
      <nav class="crumbs" id="crumbs" aria-label="面包屑"></nav>

      <div class="topbar-right">
        <span class="env-pill" id="env-pill" title="环境与连接状态">
          <span class="dot" id="env-pill-dot" data-tone="ok"></span>
          <span class="env-pill-text" id="env-text">在线</span>
          <span class="env-pill-latency" id="env-latency">—</span>
        </span>

        <button class="btn btn-ghost btn-sm auto-refresh" id="auto-refresh" type="button" title="定时刷新当前页面（10 秒）">
          <svg class="ico"><use href="#i-clock"/></svg><span id="auto-refresh-text">自动刷新</span>
        </button>

        <button class="palette-trigger" id="palette-open" type="button" title="全局搜索与跳转 (Ctrl+K)">
          <svg class="ico"><use href="#i-search"/></svg>
          <span class="palette-trigger-label">搜索 / 跳转</span>
          <kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd>
        </button>

        <button class="icon-btn" id="theme-toggle" type="button" title="切换深色 / 浅色 (T)" aria-label="切换主题">
          <svg class="ico ico-theme-dark"><use href="#i-moon"/></svg>
          <svg class="ico ico-theme-light"><use href="#i-sun"/></svg>
        </button>

        <button class="icon-btn" id="refresh" type="button" title="刷新当前页 (R)" aria-label="刷新当前页">
          <svg class="ico"><use href="#i-refresh"/></svg>
        </button>

        <div class="user-menu-wrap">
          <button class="user-chip" id="user-chip" type="button" aria-haspopup="menu" aria-expanded="false" title="账号菜单">
            <span class="user-avatar" id="user-avatar">A</span>
            <span class="user-name" id="user-name">admin</span>
            <svg class="ico user-caret"><use href="#i-chevron-down"/></svg>
          </button>
          <div class="user-menu" id="user-menu" hidden role="menu">
            <div class="user-menu-head">
              <span class="user-avatar lg" id="user-avatar-lg">A</span>
              <div><b id="user-menu-name">admin</b><small id="user-menu-role">只读令牌</small></div>
            </div>
            <button class="user-menu-item" data-goto="#/settings" role="menuitem" type="button">
              <svg class="ico"><use href="#i-gear"/></svg>账号与设置
            </button>
            <button class="user-menu-item" data-goto="#/selftest" role="menuitem" type="button">
              <svg class="ico"><use href="#i-shield-check"/></svg>接口自检
            </button>
            <button class="user-menu-item" id="menu-shortcuts" role="menuitem" type="button">
              <svg class="ico"><use href="#i-command"/></svg>快捷键 <kbd class="kbd">?</kbd>
            </button>
            <div class="user-menu-sep"></div>
            <button class="user-menu-item bad" id="user-logout" role="menuitem" type="button">
              <svg class="ico"><use href="#i-logout"/></svg>退出登录
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="main" id="main" tabindex="-1">
      <div class="boot-skeleton" aria-hidden="true">
        <div class="sk sk-title"></div>
        <div class="sk-row"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
        <div class="sk-row"><div class="sk sk-block"></div><div class="sk sk-block narrow"></div></div>
        <div class="sk sk-block" style="height:220px"></div>
      </div>
    </main>

    <footer class="footer">
      <span id="footer-left">FM 运营控制台 · 中控 + Cosmobot RPC + FM Domain 实时数据</span>
      <span class="footer-right">
        <span id="footer-latency"></span>
        <span id="footer-time"></span>
      </span>
    </footer>
  </div>
</div>

<!-- ── 全局搜索 / 命令面板 ─────────────────────────────────────────── -->
<div class="overlay palette-overlay" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="全局搜索与命令">
    <div class="palette-input-wrap">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="搜索页面 / 群 / 成员 / 消息 / 文档，或输入命令…" aria-label="搜索与命令">
      <span class="palette-scope" id="palette-scope">全部</span>
      <button class="icon-btn" id="palette-close" type="button" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="palette-body" id="palette-list"></div>
    <div class="palette-foot">
      <span class="palette-hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>↵</kbd> 打开</span>
        <span><kbd>Esc</kbd> 关闭</span>
        <span><kbd>Tab</kbd> 切换范围</span>
      </span>
      <span class="palette-foot-tip" id="palette-tip">支持跨库搜索，输入 ≥1 个字符开始</span>
    </div>
  </div>
</div>

<!-- ── 详情抽屉 ──────────────────────────────────────────────────────── -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-backdrop" data-drawer-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer-head">
      <div class="drawer-heading">
        <div class="drawer-eyebrow" id="drawer-eyebrow"></div>
        <div class="drawer-title" id="drawer-title">详情</div>
        <div class="drawer-sub" id="drawer-sub"></div>
      </div>
      <div class="drawer-actions">
        <button class="icon-btn" id="drawer-copy" type="button" title="复制 JSON" aria-label="复制 JSON">
          <svg class="ico"><use href="#i-copy"/></svg>
        </button>
        <button class="icon-btn" data-drawer-close type="button" title="关闭 (Esc)" aria-label="关闭抽屉">
          <svg class="ico"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
    <footer class="drawer-foot" id="drawer-foot" hidden></footer>
  </aside>
</div>

<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="chart-tooltip-holder" id="chart-tip-holder" hidden></div>

<script src="/static/console.js"></script>
<script src="/static/pages-core.js"></script>
<script src="/static/pages-v3.js"></script>
<script src="/static/pages-v4.js"></script>
<script src="/static/pages-qq.js"></script>
</body>
</html>
