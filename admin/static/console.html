<head>

<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex,nofollow">
<title>FM Console · 后台控制台</title>

</head>
<body>

<a class="skip-link" href="#main">跳到主内容</a>

<div class="app" id="app">
  <div class="nav-backdrop" id="nav-backdrop" hidden></div>

  <!-- ── 侧边栏 ─────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <div class="brand">
      <div class="brand-mark">FM</div>
      <div class="brand-text">
        <b>Console</b>
        <span>FM 运营控制台</span>
      </div>
      <button class="icon-btn brand-close" id="nav-close" type="button" aria-label="关闭导航">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-status" id="sidebar-status">
        <span class="dot" data-tone="muted"></span>
        <span id="sidebar-status-text">未连接</span>
      </div>
      <a class="sidebar-link" href="/classic" target="_blank" rel="noopener">
        <svg class="ico"><use href="#i-external"/></svg><span>旧版后台</span>
      </a>
      <a class="sidebar-link" href="/now" target="_blank" rel="noopener">
        <svg class="ico"><use href="#i-activity"/></svg><span>状态页 /now</span>
      </a>
      <button class="sidebar-link sidebar-logout" id="sidebar-logout" type="button">
        <svg class="ico"><use href="#i-logout"/></svg><span>退出登录</span>
      </button>
      <div class="sidebar-version">FM Console v2 · <span id="build-stamp">native / 0 构建</span></div>
    </div>
  </aside>

  <!-- ── 主区域 ─────────────────────────────────────────────── -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="nav-open" type="button" aria-label="打开导航">
        <svg class="ico"><use href="#i-menu"/></svg>
      </button>
      <nav class="crumbs" id="crumbs" aria-label="面包屑"></nav>
      <div class="topbar-right">
        <span class="net-badge" id="net-badge" title="连接状态"><span class="dot" data-tone="ok"></span><span id="net-text">在线</span></span>
        <button class="btn btn-ghost btn-sm auto-refresh" id="auto-refresh" type="button" title="定时刷新当前页面（10 秒）">
          <svg class="ico"><use href="#i-clock"/></svg><span id="auto-refresh-text">自动刷新</span>
        </button>
        <button class="btn btn-ghost btn-sm palette-trigger" id="palette-open" type="button" title="快速跳转">
          <svg class="ico"><use href="#i-search"/></svg>
          <span class="palette-trigger-label">搜索 / 跳转</span>
          <kbd>Ctrl</kbd><kbd>K</kbd>
        </button>
        <button class="icon-btn" id="refresh" type="button" title="刷新当前页 (r)" aria-label="刷新当前页">
          <svg class="ico"><use href="#i-refresh"/></svg>
        </button>
        <a class="user-chip" id="user-chip" href="#/settings" title="账号与设置">
          <svg class="ico"><use href="#i-user"/></svg>
          <span id="user-name">admin</span>
        </a>
      </div>
    </header>

    <main class="main" id="main" tabindex="-1">
      <div class="boot-skeleton" aria-hidden="true">
        <div class="sk sk-title"></div>
        <div class="sk-row">
          <div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div>
        </div>
        <div class="sk sk-block"></div>
      </div>
    </main>

    <footer class="footer">
      <span id="footer-left">FM 运营控制台 · 数据来自中控 + Cosmobot RPC + FM Domain</span>
      <span class="footer-right">
        <span id="footer-latency"></span>
        <span id="footer-time"></span>
      </span>
    </footer>
  </div>
</div>

<!-- ── 命令面板 ───────────────────────────────────────────────── -->
<div class="overlay palette-overlay" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="快速跳转与搜索">
    <div class="palette-input-wrap">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="跳转页面、找群 / 成员 / 消息、打开接口…" aria-label="搜索">
      <button class="icon-btn" id="palette-close" type="button" aria-label="关闭">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="palette-body" id="palette-list"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>↵</kbd> 打开</span>
      <span><kbd>Esc</kbd> 关闭</span>
      <span class="palette-foot-tip" id="palette-tip">输入关键词可跨库搜索（群 / 成员 / 消息 / 文库 / 赛文 / 成绩）</span>
    </div>
  </div>
</div>

<!-- ── 抽屉 ──────────────────────────────────────────────────── -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-backdrop" data-drawer-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer-head">
      <div class="drawer-heading">
        <div class="drawer-title" id="drawer-title">详情</div>
        <div class="drawer-sub" id="drawer-sub"></div>
      </div>
      <div class="drawer-actions">
        <button class="icon-btn" id="drawer-copy" type="button" title="复制 JSON" aria-label="复制 JSON">
          <svg class="ico"><use href="#i-copy"/></svg>
        </button>
        <button class="icon-btn" data-drawer-close type="button" title="关闭 (Esc)" aria-label="关闭抽屉">
          <svg class="ico"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
    <footer class="drawer-foot" id="drawer-foot" hidden></footer>
  </aside>
</div>

<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/static/echarts.min.js"></script>
<script src="/static/console.js"></script>
</body>
</html>
