name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    name: Source safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Scan tracked files for credentials
        run: python3 ops/check_secrets.py
      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck --severity=error ops/*.sh

  fm-domain:
    name: FM Domain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          if ! sudo apt-get install --yes libjpeg-dev zlib1g-dev; then
            echo "Pillow system dependencies unavailable; image tests will be skipped."
          fi
          if ! python -m pip install Pillow==11.3.0; then
            echo "Pillow installation unavailable; image tests will be skipped."
          fi
      - name: Test
        run: python -m unittest discover -s fm-domain -p 'test_*.py' -v

  admin:
    name: FM Control Center
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile admin/app.py admin/test_app.py
      - name: Test
        run: python admin/test_app.py -v
      - name: Build admin image
        run: docker build --tag fm-admin:ci -f admin/Dockerfile admin

  cabal:
    name: Cabal
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.14.2.0"

      - name: Cache Cabal
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.10.3-cabal-${{ hashFiles('cabal.project', 'cosmobot/cosmobot.cabal', 'cosmocode/cosmocode.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.10.3-cabal-

      - name: Update package index
        run: cabal update

      - name: Install sandbox dependencies
        run: |
          sudo apt-get install --yes bubblewrap tree
          # GitHub's Ubuntu runner may disable unprivileged user namespaces by default.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: cabal build cosmobot cosmocode -j all

      - name: Test
        run: cabal test cosmobot -j all --test-options=--hide-successes
