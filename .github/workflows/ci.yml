      - name: 'test: safebooru-spec'
        id: s21
        # !cancelled() stops GitHub applying its implicit success() to this
        # condition: without it, one failing suite skipped all the later ones.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cabal test --project-file=cabal.project.production cosmobot:safebooru-spec --test-options=--hide-successes --test-show-details=direct 2>&1 | tee /tmp/out-safebooru-spec.txt
      # Annotations are readable without a token, unlike this job's log.
      - name: Report failing tests as annotations
        if: ${{ !cancelled() && failure() }}
        run: |
          found=0
          for f in /tmp/out-*.txt; do
            [ -f "$f" ] || continue
            suite=$(basename "$f" .txt)
            suite=${suite#out-}
            lines=$(grep -aE "FAIL|Exception|error:|Error" "$f" | head -4)
            [ -n "$lines" ] || continue
            found=1
            while IFS= read -r line; do
              echo "::error title=${suite}::${line:0:400}"
            done <<< "$lines"
          done
          if [ "$found" = "0" ]; then
            echo "::error title=CI::a suite failed but its output had no FAIL line"
          fi
