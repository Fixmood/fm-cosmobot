name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    name: Source safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Scan tracked files for credentials
        run: python3 ops/check_secrets.py
      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck --severity=error ops/*.sh

  fm-domain:
    name: FM Domain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          if ! sudo apt-get install --yes libjpeg-dev zlib1g-dev; then
            echo "Pillow system dependencies unavailable; image tests will be skipped."
          fi
          if ! python -m pip install Pillow==11.3.0; then
            echo "Pillow installation unavailable; image tests will be skipped."
          fi
      - name: Test
        run: python -m unittest discover -s fm-domain -p 'test_*.py' -v

  admin:
    name: FM Control Center
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile admin/app.py admin/test_app.py
      - name: Test
        run: python admin/test_app.py -v
      - name: Build admin image
        run: docker build --tag fm-admin:ci -f admin/Dockerfile admin

  cabal:
    name: Cabal
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.14.2.0"

      - name: Cache Cabal
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.10.3-cabal-${{ hashFiles('cabal.project.production', 'cosmobot/cosmobot.cabal', 'cosmocode/cosmocode.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.10.3-cabal-

      - name: Update package index
        run: cabal update

      - name: Install sandbox dependencies
        run: |
          sudo apt-get install --yes bubblewrap tree
          # GitHub's Ubuntu runner may disable unprivileged user namespaces by default.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Build with the overlay the deploy uses. The dependency sources it points at
      # (vendor/katip-effectful, vendor/amazonka/lib/...) are committed to this repo
      # on purpose: they are aligned for GHC 9.10, and building from upstream pins
      # instead is what kept this job red while production built fine.
      - name: Build
        id: build
        run: cabal build --project-file=cabal.project.production cosmobot cosmocode --enable-tests -j all

      # The suite list below must match cosmobot/cosmobot.cabal. Regenerating it by
      # hand is what let this job drift away from what production builds, so the
      # mismatch is a failure, not a warning.
      - name: Suite list matches cosmobot.cabal
        run: |
          grep -E '^test-suite ' cosmobot/cosmobot.cabal | awk '{print $2}' | sort > /tmp/actual.txt
          sort .github/test-suites.txt > /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/actual.txt; then
            echo "cosmobot.cabal and .github/test-suites.txt disagree."
            echo "Add the suite to both, and add a step for it below,"
            echo "otherwise CI silently stops covering it."
            exit 1
          fi
      - name: 'test: filter-spec'
        id: s01
        # !cancelled() stops GitHub applying its implicit success() to this
        # condition: without it, one failing suite skipped all the later ones.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cabal test --project-file=cabal.project.production cosmobot:filter-spec --test-options=--hide-successes --test-show-details=direct 2>&1 | tee /tmp/out-filter-spec.txt
      - name: 'test: scratchpad-spec'
        id: s02
        # !cancelled() stops GitHub applying its implicit success() to this
